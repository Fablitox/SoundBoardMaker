name: "🐛 Report a bug — English"
description: "Report unexpected behavior and provide relevant diagnostics."
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🐛 Report a problem
        Thank you for helping improve **Soundboard Maker**. Before opening a report, please check [existing issues](https://github.com/Fablitox/SoundBoardMaker/issues) and the [FAQ](https://github.com/Fablitox/SoundBoardMaker/wiki/FAQ-EN). For general questions, use [Discussions](https://github.com/Fablitox/SoundBoardMaker/discussions).
        
        Required fields help us reproduce and fix the issue faster.
  - type: dropdown
    id: feature
    attributes:
      label: "Affected feature"
      description: "Which part of Soundboard Maker is affected?"
      options:
        - "Sound library, search and favorites"
        - "Built-in Soundboard (pages and buttons)"
        - "Audio editor"
        - "Playback and audio devices"
        - "Recording / Capture"
        - "Replay Buffer"
        - "Stream Deck plugin or connection"
        - "Installation and updates"
        - "UI, language and display"
        - "Other"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: "Soundboard Maker version"
      description: "Find it in Settings → About."
      placeholder: "Example: 1.0.0"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: "Stream Deck plugin version (if relevant)"
      description: "Optional if this issue is unrelated to Stream Deck."
      placeholder: "Example: 1.0.0.0"
    validations:
      required: false
  - type: dropdown
    id: windows
    attributes:
      label: "Operating system"
      description: "Select the Windows version you are using."
      options:
        - "Windows 11"
        - "Windows 10"
        - "Other / Not sure"
    validations:
      required: true
  - type: input
    id: windows-build
    attributes:
      label: "Windows version / build"
      description: "Optional. Press Win + R, type winver, and copy the version and build number (not personal identifiers)."
      placeholder: "Example: Windows 11 24H2 — build 26100"
    validations:
      required: false
  - type: textarea
    id: system-info
    attributes:
      label: "System and audio configuration (optional)"
      description: "Share only relevant details: CPU, RAM, audio devices, Stream Deck model, Wave Link, and related software versions."
      placeholder: "Example: Intel CPU, 16 GB RAM, USB headset, Wave Link, Stream Deck MK.2"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ### 🔎 Description and reproduction
        Explain exactly what happened, how to reproduce it, and what should have happened instead.
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to reproduce"
      description: "Provide clear, repeatable steps on a regular installation."
      placeholder: |
        1. Open Soundboard Maker...
        2. Start playing a sound...
        3. Press Record on the Stream Deck...
        4. Observe the issue.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: "What happens? Mention any error, freeze, or disconnection."
      placeholder: "Describe what you observe and include the error message if available."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What should happen instead?"
      placeholder: "Describe the expected outcome."
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: "How often does it happen?"
      description: "Optional: indicates whether the bug is reproducible or intermittent."
      options:
        - "Every time"
        - "Often"
        - "Sometimes"
        - "Only once"
        - "I can no longer reproduce it"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ### 🧾 Diagnostic / console logs (optional)
        To collect information relevant to **this particular issue**:
        
        1. Open **Settings → Advanced** in Soundboard Maker.
        2. Enable **Show diagnostic logs** (French UI: **Afficher les logs de diagnostic**) to display Replay, Record, Playback and Stream Deck events in the main window.
        3. Reproduce the issue and copy only the relevant lines, with a little context before and after.
        4. You can also select **Open logs** (French UI: **Ouvrir les logs**) in the same settings section to view the saved log files (for example `%LOCALAPPDATA%\Soundboard Maker\Logs\app-YYYYMMDD.log`).
        
        **Important:** redact account paths, filenames, recordings, tokens and any other personal data. **Do not post an entire log file** if only a few lines concern the issue.
  - type: textarea
    id: diagnostic-logs
    attributes:
      label: "Relevant diagnostic log output"
      description: "Paste only the relevant messages, after removing any private information. This field is automatically formatted as code."
      placeholder: "[Time] [Playback/Stream Deck] Event or error..."
      render: "shell"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots and additional context (optional)"
      description: "Attach redacted screenshots or describe any workarounds and other useful details."
      placeholder: "Redacted screenshots, notes, possible workaround…"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: "Before submitting"
      description: "GitHub Issues are public and can be read by other users."
      options:
        - label: "I have removed personal information, usernames, tokens and private audio data from my report."
          required: true

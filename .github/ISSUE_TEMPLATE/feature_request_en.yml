name: "💡 Suggest a feature — English"
description: "Share an idea to improve Soundboard Maker."
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### 💡 Have an idea for Soundboard Maker?
        Thanks for contributing! Check [existing suggestions](https://github.com/Fablitox/SoundBoardMaker/issues) before submitting a new one. For open discussions or polls, use [Discussions](https://github.com/Fablitox/SoundBoardMaker/discussions).
  - type: dropdown
    id: feature
    attributes:
      label: "Affected feature"
      description: "Which part of the app would benefit from this idea?"
      options:
        - "Sound library, search and favorites"
        - "Built-in Soundboard (pages and buttons)"
        - "Audio editor"
        - "Playback and audio devices"
        - "Recording / Capture"
        - "Replay Buffer"
        - "Stream Deck plugin or connection"
        - "Installation and updates"
        - "UI, language and display"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: "What problem would you like to solve?"
      description: "Describe your current workflow and what is missing."
      placeholder: "Example: I use many Soundboard pages and want to find a sound more quickly."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "What feature or improvement do you suggest?"
      description: "Explain how you would like it to work."
      placeholder: "Example: add a shortcut to search through my Soundboard keys."
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: "Why would it be useful? (optional)"
      description: "Share a specific use case or explain who would benefit."
      placeholder: "Example: during a Discord call, I could quickly trigger a sound without interrupting my game."
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: "Existing workarounds (optional)"
      description: "What solutions have you tried, and why are they insufficient?"
      placeholder: "Example: I organize sounds into folders, but searching is still slow."
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: "Screenshots, sketches, and context (optional)"
      description: "You may attach mockups or screenshots after removing private details."
      placeholder: "Redacted screenshot, illustration, additional example…"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy check"
      description: "Your suggestion will be public."
      options:
        - label: "I have not included personal audio files, usernames, tokens or other private information."
          required: true
